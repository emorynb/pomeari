site_name: Pomeari
site_description: FOSS crossposting software built on humane modular design.
site_url: https://emorynb.github.io/pomeari/

repo_name: emorynb/pomeari
repo_url: https://github.com/emorynb/pomeari
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: true
            show_root_heading: true
            show_object_full_path: false
            members_order: source
            docstring_section_style: table
            show_signature_annotations: true
            separate_signature: true
            heading_level: 2

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: index.md
  - API Reference: api.md
