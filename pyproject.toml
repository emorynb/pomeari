[project]
name = "pomeari"
version = "0.1.0"
description = "FOSS crossposting software built on humane modular design."
authors = [
  {name = "Emory Fontana", email = "emory.enby@gmail.com"},
]
maintainers = [
  {name = "Emory Fontana", email = "emory.enby@gmail.com"},
]
license = "LGPL-3.0-or-later"
license-files = ["LICEN[CS]E*", "AUTHORS.md"]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "aiosqlite>=0.22.1",
    "click>=8.5.0",
    "httpx>=0.28.1",
    "mistletoe>=1.6.0",
    "oschmod>=0.3.12",
    "python-frontmatter>=1.3.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
]

[tool.black]
target-version = ["py312"]

[project.scripts]
pomeari = "pomeari.cli:cli"

[project.entry-points."pomeari.platforms"]
emptyshort = "pomeari.platforms.emptyshort.platform:EmptyShortPlatform"
longblank = "pomeari.platforms.longblank.platform:LongBlankPlatform"
mastodon = "pomeari.platforms.mastodon.platform:MastodonPlatform"

[project.urls]
Homepage = "https://github.com/emorynb/pomeari"
Documentation = "https://emorynb.github.io/pomeari/"
Repository = "https://github.com/emorynb/pomeari"
Issues = "https://github.com/emorynb/pomeari/issues"

[build-system]
requires = ["flit_core>=4,<5"]
build-backend = "flit_core.buildapi"
